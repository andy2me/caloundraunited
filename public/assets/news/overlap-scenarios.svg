<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#1A1A1F"/>
    </linearGradient>
    <pattern id="dots2" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#2A2A2F"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>
  <rect width="1200" height="700" fill="url(#dots2)" opacity="0.4"/>

  <rect x="60" y="50" width="1080" height="2" fill="#E63946"/>
  <text x="60" y="90" font-family="Inter, sans-serif" font-size="13" letter-spacing="3" font-weight="600" fill="#888">THE RUN-IN · FOUR GAMES · TWELVE POINTS AVAILABLE</text>

  <text x="60" y="160" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#fff">Four scenarios.</text>
  <text x="60" y="205" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#fff">One narrow path home.</text>

  <!-- Scenario table -->
  <g font-family="Inter, sans-serif">
    <!-- Header -->
    <line x1="60" y1="270" x2="1140" y2="270" stroke="#333"/>
    <text x="60" y="295" font-size="11" letter-spacing="3" font-weight="700" fill="#888">SCENARIO</text>
    <text x="620" y="295" font-size="11" letter-spacing="3" font-weight="700" fill="#888">FINAL POINTS</text>
    <text x="880" y="295" font-size="11" letter-spacing="3" font-weight="700" fill="#888">VERDICT</text>
    <line x1="60" y1="310" x2="1140" y2="310" stroke="#333"/>

    <!-- Row 1: Win all 4 -->
    <g transform="translate(0, 350)">
      <text x="60" y="0" font-family="Georgia, serif" font-size="22" fill="#fff">Win all four</text>
      <text x="60" y="25" font-size="13" fill="#666">incl. Stella, Currimundi, Buderim, Coolum</text>
      <text x="620" y="0" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">24</text>
      <text x="880" y="0" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#4ADE80">Near certain</text>
      <line x1="60" y1="50" x2="1140" y2="50" stroke="#222"/>
    </g>

    <!-- Row 2: Win 3 -->
    <g transform="translate(0, 430)">
      <text x="60" y="0" font-family="Georgia, serif" font-size="22" fill="#fff">Win three, lose one</text>
      <text x="60" y="25" font-size="13" fill="#666">drop a result to Stella or Currimundi</text>
      <text x="620" y="0" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">21</text>
      <text x="880" y="0" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#F77F00">Strong — likely in</text>
      <line x1="60" y1="50" x2="1140" y2="50" stroke="#222"/>
    </g>

    <!-- Row 3: Win 2 -->
    <g transform="translate(0, 510)">
      <text x="60" y="0" font-family="Georgia, serif" font-size="22" fill="#fff">Win two, lose two</text>
      <text x="60" y="25" font-size="13" fill="#666">beat Coolum &amp; Buderim only</text>
      <text x="620" y="0" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">18</text>
      <text x="880" y="0" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#E63946">Coin flip</text>
      <line x1="60" y1="50" x2="1140" y2="50" stroke="#222"/>
    </g>

    <!-- Row 4: Win 1 -->
    <g transform="translate(0, 590)">
      <text x="60" y="0" font-family="Georgia, serif" font-size="22" fill="#fff">Win one, lose three</text>
      <text x="60" y="25" font-size="13" fill="#666">the wheels come off</text>
      <text x="620" y="0" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">15</text>
      <text x="880" y="0" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#888">Very unlikely</text>
    </g>
  </g>
</svg>
